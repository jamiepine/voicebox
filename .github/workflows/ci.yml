name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets the checks be re-run on demand from the Actions tab (or the API)
  # without pushing a commit — useful after enabling Actions on a fork,
  # where the events that would have triggered earlier runs are long gone.
  workflow_dispatch:

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck app + web
        run: bun run typecheck

      - name: Build web smoke test
        run: bun run build:web

  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      # Deliberately not requirements.txt: the suites below stub the TTS /
      # STT / LLM backends, so torch and the rest of the ML stack are never
      # imported. See the header of requirements-test.txt.
      - name: Install test dependencies
        run: pip install -r backend/requirements-test.txt

      # The whole backend is ruff-clean (see backend/STYLE_GUIDE.md); rules
      # that fight a deliberate pattern are ignored explicitly, with the
      # reason, in backend/pyproject.toml rather than tolerated here.
      - name: Lint backend
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Backend tests
        run: |
          python -m pytest \
            backend/tests/test_voice_agent.py \
            backend/tests/test_voice_agent_v2.py \
            backend/tests/test_profile_duplicate_names.py \
            -q
